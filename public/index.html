<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JPN - VISUAL EXPERIENCE</title>
</head>
<body>
    <div id="noise-overlay"></div>
    <div id="bass-circle"></div>
    <div id="crack-effect"></div>

    <div id="car-scene">
        <div class="road"></div>
        <img src="car.png" id="car-image" alt="Carro">
    </div>

    <img src="plane.png" id="plane-image" alt="Avión">

    <div id="final-text-container">
        <h1 id="final-msg-1" class="final-msg">TODOS LOS CAMINOS<br>LLEVAN A JAPÓN</h1>
        <h2 id="final-msg-2" class="final-msg">DECIR ADIÓS NO SIEMPRE<br>TIENE QUE SER ALGO TRISTE</h2>
    </div>

    <div id="corner-tl" class="corner-text top-left">TODOS LOS CAMINOS LLEVAN A JAPÓN</div>
    <div id="corner-tr" class="corner-text top-right">TODOS LOS CAMINOS LLEVAN A JAPÓN</div>
    <div id="corner-bl" class="corner-text bottom-left">TODOS LOS CAMINOS LLEVAN A JAPÓN</div>
    <div id="corner-br" class="corner-text bottom-right">TODOS LOS CAMINOS LLEVAN A JAPÓN</div>

    <div id="photo-rain-container"></div>

    <header class="top-bar">
        <div class="volume-wrapper">
            <span class="vol-icon">🔊</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
    </header>

    <div id="start-screen">
        <div class="center-display">
            <h1 class="title glitch" data-text="JPN">JPN</h1>
            <div class="croc-container">
                <img src="img1.png" id="hero-image">
            </div>
            <p id="main-subtitle">TODOS LOS CAMINOS LLEVAN A JAPÓN</p>
            <button id="btn-enter" class="cyber-btn">INICIAR VIAJE</button>
        </div>
    </div>

    <div id="transition-screen">
        <img src="fer.jpg" id="transition-photo">
    </div>

    <div id="lyric-container"></div> 
    <audio id="musica" src="cancion.mp3" crossOrigin="anonymous"></audio>
    <div class="dev-credits">SYSTEM ARCHITECT: <span class="hacker-name">@emimezaa</span></div>
    <script src="script.js"></script>
</body>
</html>
